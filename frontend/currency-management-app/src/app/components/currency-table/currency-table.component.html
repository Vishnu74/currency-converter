<div class="bg-white rounded-2xl shadow p-6 max-w-5xl mx-auto border border-blue-100">

    <h2 class="text-lg font-semibold mb-4 text-blue-700">
        Currency Rates (Base: USD)
    </h2>

    <input type="text" [(ngModel)]="filterText" (input)="onFilterChange()" placeholder="Filter by currency or rate"
        class="border border-blue-200 rounded-lg px-4 py-2 mb-4 w-full focus:outline-none focus:ring-2 focus:ring-blue-300" />

    <div class="h-[300px] overflow-y-auto border border-blue-100 rounded-xl" (scroll)="onScroll($event)">
        <table class="w-full border-collapse">
            <thead class="bg-blue-50 sticky top-0 z-10 text-blue-800">
                <tr>
                    <th class="p-4 text-left">Currency</th>
                    <th class="p-4 text-right">Online sell rate</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let r of displayedRates" class="border-t border-blue-50">
                    <td class="p-4 font-medium text-slate-700">{{ r[0] }}</td>
                    <td class="p-4 text-right font-semibold text-blue-700">
                        {{ r[1] | number:'1.4-4' }}
                    </td>
                </tr>

                <tr *ngIf="loading">
                    <td colspan="2" class="p-4 text-center text-blue-500">
                        Loading...
                    </td>
                </tr>

                <tr *ngIf="!loading && displayedRates.length === 0">
                    <td colspan="2" class="p-4 text-center text-gray-500">
                        No results found
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
